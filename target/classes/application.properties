spring.application.name=trivia
server.port=8081

# Conexión PostgreSQL en Supabase (Transaction Pooler)
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.qpznmqvhlwdsjupvihkw
spring.datasource.password=5709765180103
spring.datasource.driver-class-name=org.postgresql.Driver

# REGLA DE ORO: JPA / Hibernate NUNCA modificará la base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Solución para el Pooler de Supabase (Evita prepared statements duplicados)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Flyway desactivado para control 100% manual
spring.flyway.enabled=false

# Limites e Imagenes
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Sesiones
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Negocio
trivia.question-time-limit-ms=10000
trivia.questions-per-game=10
trivia.storage.images-dir=./storage/question-images
trivia.storage.max-bytes=2097152
trivia.admin.default-username=admin
trivia.admin.default-password=fersal2026